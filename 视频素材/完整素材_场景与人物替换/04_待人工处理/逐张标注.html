iginal": "原截图对照/041_15.933s_楼顶尽头的运动残影.png", "strip": "前后帧参考/041_15.933s_楼顶尽头的运动残影.jpg"}, {"id": "058", "title": "白光扫过肩背", "sec": "26.300", "frame": 789, "reason": "只有受击肩背及交叉的白光，未见能确认身份的脸、发型或衣饰。", "base": "待处理底图/058_26.300s_白光扫过肩背.png", "w": 1024, "h": 446, "original": "原截图对照/058_26.300s_白光扫过肩背.png", "strip": "前后帧参考/058_26.300s_白光扫过肩背.jpg"}, {"id": "063", "title": "强光切过流血面孔", "sec": "29.567", "frame": 887, "reason": "五官被正面白光遮去一半，又与红色叠影交错。没有足够清楚的头发或额纹。", "base": "待处理底图/063_29.567s_强光切过流血面孔.png", "w": 1024, "h": 497, "original": "原截图对照/063_29.567s_强光切过流血面孔.png", "strip": "前后帧参考/063_29.567s_强光切过流血面孔.jpg"}, {"id": "068", "title": "白闪中的对峙", "sec": "32.000", "frame": 960, "reason": "曝光使人物只余淡色轮廓，无法确认位置和身份。", "base": "待处理底图/068_32.000s_白闪中的对峙.png", "w": 1024, "h": 497, "original": "原截图对照/068_32.000s_白闪中的对峙.png", "strip": "前后帧参考/068_32.000s_白闪中的对峙.jpg"}, {"id": "076", "title": "红光射向长街", "sec": "35.267", "frame": 1058, "reason": "左前景被红光覆盖，无法确定人物身份，保留原有轮廓。仅替换右侧能辨认的五条悟。", "base": "待处理底图/076_35.267s_红光射向长街.png", "w": 1678, "h": 937, "original": "原截图对照/076_35.267s_红光射向长街.png", "strip": "前后帧参考/076_35.267s_红光射向长街.jpg"}, {"id": "079", "title": "阴影中的亮瞳", "sec": "36.200", "frame": 1086, "reason": "只见两处发光眼睛与侧边发丝，面部被阴影吞没，缺少能排除另一位人物的标记。", "base": "待处理底图/079_36.200s_阴影中的亮瞳.png", "w": 1024, "h": 497, "original": "原截图对照/079_36.200s_阴影中的亮瞳.png", "strip": "前后帧参考/079_36.200s_阴影中的亮瞳.jpg"}, {"id": "083", "title": "逆光白场中的上身", "sec": "37.500", "frame": 1125, "reason": "整段高光溢出，只有上身模糊轮廓。", "base": "待处理底图/083_37.500s_逆光白场中的上身.png", "w": 1024, "h": 497, "original": "原截图对照/083_37.500s_逆光白场中的上身.png", "strip": "前后帧参考/083_37.500s_逆光白场中的上身.jpg"}, {"id": "085", "title": "横过身体的红色拖影", "sec": "38.533", "frame": 1156, "reason": "身形和面容被快速移动的红光糊成团。", "base": "待处理底图/085_38.533s_横过身体的红色拖影.png", "w": 1024, "h": 497, "original": "原截图对照/085_38.533s_横过身体的红色拖影.png", "strip": "前后帧参考/085_38.533s_横过身体的红色拖影.jpg"}, {"id": "088", "title": "蓝球前叠合的轮廓", "sec": "40.133", "frame": 1204, "reason": "球与数个快速叠印的身体局部重叠，人物脸部不可分。", "base": "待处理底图/088_40.133s_蓝球前叠合的轮廓.png", "w": 1024, "h": 497, "original": "原截图对照/088_40.133s_蓝球前叠合的轮廓.png", "strip": "前后帧参考/088_40.133s_蓝球前叠合的轮廓.jpg"}, {"id": "097", "title": "紫光下的群体剪影", "sec": "44.667", "frame": 1340, "reason": "紫光照亮若干轮廓，远处人影和前景异形重叠，难以确认各自身份。", "base": "待处理底图/097_44.667s_紫光下的群体剪影.png", "w": 1024, "h": 497, "original": "原截图对照/097_44.667s_紫光下的群体剪影.png", "strip": "前后帧参考/097_44.667s_紫光下的群体剪影.jpg"}]</script><script>
'use strict';
const shots=JSON.parse(document.querySelector('#data').textContent), $=id=>document.getElementById(id);
const characters = {
  '小黑子': '#ff986f',
  '奶娃': '#7cdaca',
  '豆包': '#86baff',
  '肥嘟嘟': '#f798bb',
  '牛来': '#e9cd69'
};
const colors = {...characters, '跳过此处': '#c3bde5'};

const key='kuro-naiwa.review17.v1', format='kuro-naiwa-review-v1';
let index=0,tool='小黑子',draft=null,storageOK=true;
const empty=()=>({skip:false,regions:[],note:''});
let items=shots.map(empty);
function status(v){return v.skip?'整张跳过':v.regions.length?'已标注':'待标注'}
function save(){try{localStorage.setItem(key,JSON.stringify({items,index}));storageOK=true}catch{storageOK=false}
 $('msg').textContent=storageOK?'进度已保存在当前浏览器。导出 JSON 可备份或交回处理。':'浏览器无法保存进度，请导出 JSON 备份。'}
function valid(v){return v && typeof v.skip==='boolean' && typeof v.note==='string' && Array.isArray(v.regions) && !(v.skip&&v.regions.length) && v.regions.every(r=>r&&Object.hasOwn(colors,r.label)&&Array.isArray(r.box)&&r.box.length===4&&r.box.every(Number.isInteger)&&r.box[0]>=0&&r.box[1]>=0&&r.box[2]>r.box[0]&&r.box[3]>r.box[1])}
function fits(v,i){return valid(v)&&v.regions.every(r=>r.box[2]<=shots[i].w&&r.box[3]<=shots[i].h)}
try{const s=JSON.parse(localStorage.getItem(key));if(s&&s.items.length===shots.length&&s.items.every(fits)){items=s.items;index=Number.isInteger(s.index)&&shots[s.index]?s.index:0}}catch{}
function drawBox(r){const s=shots[index],b=r.box,el=document.createElement('div');el.className='mark';el.style.cssText='--tone:'+colors[r.label]+';left:'+100*b[0]/s.w+'%;top:'+100*b[1]/s.h+'%;width:'+100*(b[2]-b[0])/s.w+'%;height:'+100*(b[3]-b[1])/s.h+'%';const t=document.createElement('span');t.textContent=r.label;el.append(t);$('boxes').append(el)}
function boxes(){ $('boxes').replaceChildren();items[index].regions.forEach(drawBox);if(draft)drawBox({label:tool,box:bounds(draft.start,draft.end)})}
function refresh(){const v=items[index];$('nav').replaceChildren();shots.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.id;const t=document.createElement('small');t.textContent=status(items[i]);b.append(t);b.setAttribute('aria-current',i===index);b.onclick=()=>show(i);$('nav').append(b)});
 $('progress').textContent=items.filter(v=>v.skip||v.regions.length).length+' / '+shots.length+' 已处理';$('regions').replaceChildren();
 v.regions.forEach((r,i)=>{const row=document.createElement('div');row.className='row';const label=document.createElement('span');label.textContent=(i+1)+' · ';
 const select=document.createElement('select');
 select.setAttribute('aria-label','区域 '+(i+1)+' 的处理方式');
 for(const name of Object.keys(colors))select.add(new Option(name,name));
 select.value=r.label;
 select.onchange=()=>{r.label=select.value;refresh();save()};
 label.append(select);const del=document.createElement('button');del.textContent='移除';del.onclick=()=>{v.regions.splice(i,1);refresh();save()};row.append(label,del);$('regions').append(row)});
 $('skip').setAttribute('aria-pressed',v.skip);$('skip').textContent=v.skip?'取消整张跳过':'整张跳过';$('reset').disabled=!v.skip&&!v.regions.length;boxes()}
function show(i){draft=null;index=i;const s=shots[i];$('title').textContent=s.id+'　'+s.title+' · '+s.sec+'s';$('reason').textContent=s.reason;$('base').src=s.base;$('stage').style.aspectRatio=s.w+'/'+s.h;
 $('original').src=$('originalLink').href=s.original;$('strip').src=$('stripLink').href=s.strip;$('note').value=items[i].note;$('prev').disabled=i===0;$('next').disabled=i===shots.length-1;refresh();save()}
function choose(name){tool=name;for(const b of $('tools').querySelectorAll('button'))b.setAttribute('aria-pressed',b.dataset.name===tool)}
for(const name of Object.keys(colors)){const b=document.createElement('button');b.dataset.name=name;b.style.setProperty('--tone',colors[name]);const dot=document.createElement('i');dot.className='chip';b.append(dot,name);b.onclick=()=>choose(name);$('tools').append(b)}
const hint=document.createElement('small');hint.className='hint';hint.textContent='先选角色，再在底图上拖框。每张可框多处。';$('tools').append(hint);choose(tool);
function point(e){const s=shots[index],r=$('stage').getBoundingClientRect();return [Math.round(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*s.w),Math.round(Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))*s.h)]}
function bounds(a,b){return [Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.max(a[0],b[0]),Math.max(a[1],b[1])]}
const stage=$('stage');stage.onpointerdown=e=>{if(e.button!==0||draft||!$('base').complete||!$('base').naturalWidth)return;stage.setPointerCapture(e.pointerId);draft={id:e.pointerId,start:point(e),end:point(e)}};
stage.onpointermove=e=>{if(draft?.id===e.pointerId){draft.end=point(e);boxes()}};
stage.onpointerup=e=>{if(draft?.id!==e.pointerId)return;const b=bounds(draft.start,point(e));draft=null;if(b[2]-b[0]>=3&&b[3]-b[1]>=3){items[index].skip=false;items[index].regions.push({label:tool,box:b});refresh();save()}else boxes()};
stage.onpointercancel=()=>{draft=null;boxes()};
$('skip').onclick=()=>{const v=items[index];if(v.regions.length&&!confirm('整张跳过会清除本张所有框，继续吗？'))return;v.skip=!v.skip;v.regions=[];refresh();save()};
$('reset').onclick=()=>{if(!confirm('清空本张标记并恢复为待标注？'))return;items[index].skip=false;items[index].regions=[];refresh();save()};
$('note').oninput=()=>{items[index].note=$('note').value;save()};$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);
$('exportBtn').onclick=()=>{const result={format,coordinates:'待处理底图原尺寸像素；原点在左上；bbox_xyxy 为 [左,上,右,下]，右和下边界不包含在内',shots:shots.map((s,i)=>({id:s.id,frame:s.frame,seconds:Number(s.sec),image:s.base,width:s.w,height:s.h,status:items[i].skip?'skip':items[i].regions.length?'annotated':'pending',note:items[i].note,regions:items[i].regions.map(r=>({action:r.label==='跳过此处'?'skip_region':'replace',character:r.label==='跳过此处'?null:r.label,bbox_xyxy:r.box}))}))};
 const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='17镜头_人工标注清单.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)};
$('importBtn').onclick=()=>$('upload').click();
$('upload').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.format!==format||data.shots.length!==shots.length)throw Error();
 const incoming=shots.map((s,i)=>{const v=data.shots.find(v=>v.id===s.id);if(!v||v.image!==s.base||v.frame!==s.frame||v.width!==s.w||v.height!==s.h||!['skip','annotated','pending'].includes(v.status)||!Array.isArray(v.regions)||(v.status==='annotated')!==Boolean(v.regions.length))throw Error();
 const state={skip:v.status==='skip',note:v.note,regions:v.regions.map(r=>{const label=r.action==='skip_region'&&r.character===null?'跳过此处':r.action==='replace'&&Object.hasOwn(characters,r.character)?r.character:null;return {label,box:r.bbox_xyxy}})};if(!fits(state,i))throw Error();return state});
 if(items.some(v=>v.skip||v.note||v.regions.length)&&!confirm('用导入的清单替换当前标注进度？'))return;items=incoming;show(index);$('msg').textContent='已导入标注清单。'}catch{$('msg').textContent='导入失败，请选择本页导出的完整 JSON 清单。'}finally{e.target.value=''}};
show(index);
</script></html>
