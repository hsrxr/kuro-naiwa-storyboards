function point(e){const s=shots[index],r=$('stage').getBoundingClientRect();return [Math.round(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*s.w),Math.round(Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))*s.h)]}
function bounds(a,b){return [Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.max(a[0],b[0]),Math.max(a[1],b[1])]}
const stage=$('stage');stage.onpointerdown=e=>{if(e.button!==0||draft||!$('base').complete||!$('base').naturalWidth)return;stage.setPointerCapture(e.pointerId);draft={id:e.pointerId,start:point(e),end:point(e)}};
stage.onpointermove=e=>{if(draft?.id===e.pointerId){draft.end=point(e);boxes()}};
stage.onpointerup=e=>{if(draft?.id!==e.pointerId)return;const b=bounds(draft.start,point(e));draft=null;if(b[2]-b[0]>=3&&b[3]-b[1]>=3){items[index].skip=false;items[index].regions.push({label:tool,box:b});refresh();save()}else boxes()};
stage.onpointercancel=()=>{draft=null;boxes()};
$('skip').onclick=()=>{const v=items[index];if(v.regions.length&&!confirm('整张跳过会清除本张所有框，继续吗？'))return;v.skip=!v.skip;v.regions=[];refresh();save()};
$('reset').onclick=()=>{if(!confirm('清空本张标记并恢复为待标注？'))return;items[index].skip=false;items[index].regions=[];refresh();save()};
$('note').oninput=()=>{items[index].note=$('note').value;save()};$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);
function manifest(){return {format,coordinates:'待处理底图原尺寸像素；原点在左上；bbox_xyxy 为 [左,上,右,下]，右和下边界不包含在内',shots:shots.map((s,i)=>({id:s.id,frame:s.frame,seconds:Number(s.sec),image:s.base,width:s.w,height:s.h,status:items[i].skip?'skip':items[i].regions.length?'annotated':'pending',note:items[i].note,regions:items[i].regions.map(r=>({action:r.label==='跳过此处'?'skip_region':'replace',character:r.label==='跳过此处'?null:r.label,bbox_xyxy:r.box}))}))};
 }
$('exportBtn').onclick=()=>{const result=manifest();const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=shots.length+'镜头_人工标注清单.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)};
$('importBtn').onclick=()=>$('upload').click();
$('upload').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());const {incoming,legacy}=decodeManifest(data);
 if(items.some(v=>v.skip||v.note||v.regions.length)&&!confirm(legacy?'更新原有 17 张标注，保留新增镜头的进度？':'用导入的清单替换当前标注进度？'))return;items=incoming;show(index);$('msg').textContent='已导入标注清单。'}catch{$('msg').textContent='导入失败，请选择本页导出的完整 JSON 清单。'}finally{e.target.value=''}};
function decodeManifest(data){
if(data.format!==format||!Array.isArray(data.shots))throw Error();
 const byId=new Map(data.shots.map(v=>[v.id,v]));
 const legacy=byId.size===17 && [...previousIds].every(id=>byId.has(id));
 if(byId.size!==data.shots.length || (!legacy && byId.size!==shots.length))throw Error();
 const incoming=shots.map((s,i)=>{const v=byId.get(s.id);if(legacy&&!previousIds.has(s.id))return items[i];if(!v||v.image!==s.base||v.frame!==s.frame||v.width!==s.w||v.height!==s.h||!['skip','annotated','pending'].includes(v.status)||!Array.isArray(v.regions)||(v.status==='annotated')!==Boolean(v.regions.length))throw Error();
 const state={skip:v.status==='skip',note:v.note,regions:v.regions.map(r=>{const label=r.action==='skip_region'&&r.character===null?'跳过此处':r.action==='replace'&&Object.hasOwn(characters,r.character)?r.character:null;return {label,box:r.bbox_xyxy}})};if(!fits(state,i))throw Error();if(legacy&&s.id==='088'&&v.status==='pending')return {skip:true,note:v.note||'背景图',regions:[]};return state});
return {incoming,legacy};
}
async function startup(){
 if(!live){$('liveLink').hidden=false;show(index);return}
 document.querySelector('main').inert=true;
 try{
  const res=await fetch('/api/annotations',{cache:'no-store'});
  if(!res.ok)throw Error();
  const result=decodeManifest(await res.json());
  if(result.legacy)throw Error();
  revision=res.headers.get('ETag');items=result.incoming;savedState=JSON.stringify(items);
  show(firstPending());$('writeBtn').hidden=false;document.querySelector('main').inert=false;
 }catch{$('msg').textContent='无法读取固定清单，请检查文件后刷新页面。'}
}
$('writeBtn').onclick=async()=>{
 const snapshot=JSON.stringify(items);$('writeBtn').disabled=true;
 try{
  const res=await fetch('/api/annotations',{method:'PUT',headers:{'Content-Type':'application/json','If-Match':revision},body:JSON.stringify(manifest())});
  if(res.status===409){$('msg').textContent='文件已被其他窗口修改。请先导出当前标注，再刷新核对。';return}
  if(!res.ok)throw Error();
  revision=res.headers.get('ETag');savedState=snapshot;
  $('msg').textContent=snapshot===JSON.stringify(items)?'已覆盖保存到 33镜头_人工标注清单.json。':'已保存；保存期间的新改动请再保存一次。';
 }catch{$('msg').textContent='写入失败，请重试或导出 JSON 备份。'}finally{$('writeBtn').disabled=false}
};
window.addEventListener('beforeunload',e=>{if(live&&revision&&savedState!==JSON.stringify(items)){e.preventDefault();e.returnValue=''}});
startup();
</script></html>
